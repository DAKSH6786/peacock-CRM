# CI scaffold — architecture stage
name: ci

on:
  push:
  pull_request:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Peacock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        env:
          JOB_BACKEND: memory
          DATABASE_URL: postgresql+psycopg://peacock:peacock@localhost:5432/peacock_one
        run: pytest tests/ -q

  web-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Peacock/apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm test
      - run: npm run typecheck
