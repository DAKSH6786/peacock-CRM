[project]
name = "peacock-one"
version = "0.1.0"
description = "Peacock One — generative visibility intelligence platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14.0",
  "psycopg[binary]>=3.2.0",
  "pgvector>=0.3.6",
  "redis>=5.2.0",
  "celery[redis]>=5.4.0",
  "httpx>=0.28.0",
  "beautifulsoup4>=4.12.0",
  "playwright>=1.49.0",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "bcrypt>=4.0.0,<4.1",
  "email-validator>=2.2.0",
  "python-multipart>=0.0.17",
  "structlog>=24.4.0",
  "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "anyio>=4.6.0",
  "ruff>=0.8.0",
  "httpx>=0.28.0",
]

[build-system]
requires = ["setuptools>=75.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [
  "backend",
  "backend/packages",
  "backend/services",
  "engines/seo",
  "engines/aeo",
  "engines/geo",
  "engines/crawler",
  "engines/competitor-intelligence",
  "engines/citation-intelligence",
  "engines/content-intelligence",
  "engines/opportunity-engine",
  "engines/llm-intelligence",
  "engines/ai-visibility",
  "engines/measurement",
  "engines/experiment-engine",
  "engines/learning-engine",
  "plugins",
  "agents",
  "experts",
  "publishing",
]
include = ["*"]
namespaces = false


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [
  ".",
  "backend",
  "backend/packages",
  "backend/services",
  "engines/seo",
  "engines/aeo",
  "engines/geo",
  "engines/crawler",
  "engines/competitor-intelligence",
  "engines/citation-intelligence",
  "engines/content-intelligence",
  "engines/opportunity-engine",
  "engines/llm-intelligence",
  "engines/ai-visibility",
  "engines/measurement",
  "engines/experiment-engine",
  "engines/learning-engine",
  "plugins",
  "agents",
  "experts",
  "publishing",
]

[tool.ruff]
line-length = 100
target-version = "py312"
