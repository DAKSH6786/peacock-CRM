services:
  db:
    image: postgres:16-alpine
    container_name: peacock-one-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: peacock
      POSTGRES_PASSWORD: peacock
      POSTGRES_DB: peacock_one
    ports:
      - "5432:5432"
    volumes:
      - peacock_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peacock -d peacock_one"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: peacock-one-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: peacock
      MINIO_ROOT_PASSWORD: peacocksecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - peacock_minio_data:/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: peacock-one-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://peacock:peacock@db:5432/peacock_one?schema=public
      AUTH_SECRET: change-me-to-a-long-random-secret-value
      AUTH_URL: http://localhost:3000
      APP_URL: http://localhost:3000
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: peacock-one
      S3_ACCESS_KEY_ID: peacock
      S3_SECRET_ACCESS_KEY: peacocksecret
      S3_FORCE_PATH_STYLE: "true"
      JOBS_ENABLED: "true"
    ports:
      - "3000:3000"

volumes:
  peacock_pg_data:
  peacock_minio_data:
